[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opsrag"
version = "0.9.0"
description = "A compact, production-oriented technical knowledge RAG assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "charset-normalizer>=3.4,<4.0",
    "fastapi>=0.115,<1.0",
    "langgraph>=1.2,<2.0",
    "openai>=2.0,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pypdf>=5.0,<7.0",
    "qdrant-client>=1.19,<2.0",
    "rank-bm25>=0.2.2,<1.0",
    "sentence-transformers>=5.7,<7.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
